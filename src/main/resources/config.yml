# InterCase — налаштування
# ring-radius: відстань від кейса до 8 предметів
ring-radius: 3.6
# force-animation: -1 = випадкова; 0 мечі, 1 моби, 2 вихор часу, 3 рулетка (для тесту)
force-animation: -1

